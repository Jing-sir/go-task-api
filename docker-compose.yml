services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
      POSTGRES_DB: go_task_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    ports:
      - "9999:8080"
    depends_on:
      - db
      - redis
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ""
      DB_NAME: go_task_db
      DB_SSLMODE: disable
      # ${VAR:-默认值}：外部设了 JWT_SECRET 就用外部的，没设才用这个本地默认值。
      # 以后真要部署时，在环境里设好 JWT_SECRET 即可，不用改这个文件。
      JWT_SECRET: ${JWT_SECRET:-test-secret}
      JWT_EXPIRE_HOURS: 3
      SERVER_PORT: 8080
      REDIS_ADDR: redis:6379

volumes:
  pgdata:
